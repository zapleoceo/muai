name: vera3

# Потолок логов задаём явно: демон-дефолт (/etc/docker/daemon.json) — 50m×3 на
# контейнер, т.е. до ~2 ГБ на одну Vera при 14 контейнерах, и он общий для всех
# проектов бокса. 10m×3 хватает для разбора инцидента, но не съедает диск.
x-logging: &default-logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

# ─── Про mem_limit ───────────────────────────────────────────────────────────
# До 2026-09-01 лимитов памяти не было НИ У ОДНОГО контейнера. На боксе 3.7 ГиБ
# и три стека (vera3, aibroker, stepan2), поэтому утечка или разовый тяжёлый
# батч в любом контейнере отдавали выбор жертвы OOM-killer'у — включая чужие
# проекты. Монитор память тоже не смотрел вообще (теперь смотрит: проверки 3b
# и 3c в scripts/vera3-monitor.sh).
#
# mem_limit — ПОТОЛОК, а не резервирование, поэтому сумма может превышать
# физическую память, и здесь она её превышает (~4.4 ГиБ потолков) сознательно.
# Смысл этих цифр — поймать РАЗБЕЖАВШИЙСЯ контейнер и убить именно его, а не
# случайного соседа. От медленного коллективного роста они не спасают.
#
# Числа — верхние оценки, а не замеры: снять `docker stats` с живого бокса при
# написании было нельзя. Занижение опаснее завышения — слишком тесный лимит
# убивает здоровый контейнер, то есть ровно ту аварию, которую предотвращает.
# Первый же спокойный час на проде: `docker stats --no-stream` и подтянуть
# вниз по факту.

services:
  # ─── Storage ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vera3-postgres
    # Docker даёт /dev/shm всего 64 МБ — параллельным воркерам Postgres этого
    # не хватает на таблицах такого размера: `VACUUM events` падал с «could not
    # resize shared memory segment … No space left on device» (2026-07-24).
    # Автовакуум это НЕ затрагивает (он всегда однопоточный), но ручной VACUUM
    # и параллельные seq-scan'ы в brain-search — да.
    shm_size: 256mb
    environment:
      POSTGRES_USER: vera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vera}
      POSTGRES_DB: vera
    volumes:
      - vera3_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera -d vera"]
      interval: 10s
      timeout: 5s
      retries: 5
    # shared_buffers 128m + work_mem на бэкенд + кэш; крупнейший потребитель
    mem_limit: 768m
    restart: unless-stopped
    logging: *default-logging

  # ─── Gateway ─────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    container_name: vera3-gateway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://vera:${POSTGRES_PASSWORD:-vera}@postgres:5432/vera
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set}
      TOKEN_SECRET: ${TOKEN_SECRET}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:?OWNER_TELEGRAM_ID must be set}
      # broker-only: needed by /v1/claude/remember to embed for semantic dedup
      BROKER_URL: ${BROKER_URL:-}
      BROKER_PROJECT_KEY: ${BROKER_PROJECT_KEY:-}
      # /v1/search proxy target for vera-mcp's vera_recall tool
      SEARCH_URL: http://brain-search:8000
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8001:8000"
    # FastAPI + пул на 10 соединений
    mem_limit: 192m
    restart: unless-stopped
    logging: *default-logging

  # ─── Brain: Triage Workers (scalable) ──────────────────────────────────
  # SELECT FOR UPDATE SKIP LOCKED исключает race condition между воркерами.
  # deploy.replicas — чтобы обычный `docker compose up -d` поднимал все реплики,
  # а не сбрасывал до 1 (раньше скейл жил только пока не сделаешь up без --scale).
  # Переопределить: BRAIN_TRIAGE_REPLICAS=N docker compose up -d
  brain-triage:
    build:
      context: ..
      dockerfile: services/brain-triage/Dockerfile
    # container_name НЕ задан — иначе scale ломается
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      # 2026-07-01: 3 → 5 реплик для разбора >90-дневного бекфила
      # (142k pending). Broker/DB держат — mistral идёт в 0.05% ошибок,
      # SELECT FOR UPDATE SKIP LOCKED масштабируется.
      replicas: ${BRAIN_TRIAGE_REPLICAS:-5}
    environment:
      DATABASE_URL: postgresql+asyncpg://vera:${POSTGRES_PASSWORD:-vera}@postgres:5432/vera
      TOKEN_SECRET: ${TOKEN_SECRET}
      TRIAGE_POLL_INTERVAL_S: ${TRIAGE_POLL_INTERVAL_S:-5}
      TRIAGE_BATCH_SIZE: ${TRIAGE_BATCH_SIZE:-16}
      # 2026-07-01: 5 → 10 параллельных LLM-вызовов на реплику. Broker'у
      # без проблем (Mistral latency ~1.1s, 0.05% ошибок сейчас).
      # Итого 5×10 = 50 in-flight (было 15). Даёт ~10-14k triage/ч.
      TRIAGE_CONCURRENCY: ${TRIAGE_CONCURRENCY:-10}
      TRIAGE_PACE_S: ${TRIAGE_PACE_S:-0.5}
      # rel-extract — фоновая работа МИМО TRIAGE_CONCURRENCY: задачи не
      # ожидаются, а семафор в process_pending живёт один вызов. Свой потолок
      # и свой таймаут, иначе фон выедает пул (10 соединений) у claim'а и
      # записи статусов. Порог допуска — по шкале importance 0-100.
      TRIAGE_REL_MIN_IMPORTANCE: ${TRIAGE_REL_MIN_IMPORTANCE:-60}
      TRIAGE_REL_CONCURRENCY: ${TRIAGE_REL_CONCURRENCY:-3}
      TRIAGE_REL_TIMEOUT_S: ${TRIAGE_REL_TIMEOUT_S:-180}
      VERA_DAILY_GLOBAL_CAP_USD: ${VERA_DAILY_GLOBAL_CAP_USD:-2.0}
      BROKER_URL: ${BROKER_URL:-}
      BROKER_PROJECT_KEY: ${BROKER_PROJECT_KEY:-}
    # ×5 реплик = 1.25 ГБ потолка; держит батч из 16 событий и до 10 ответов LLM
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  # ─── Brain: Search ──────────────────────────────────────────────────────
  brain-search:
    build:
      context: ..
      dockerfile: services/brain-search/Dockerfile
    container_name: vera3-brain-search
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://vera:${POSTGRES_PASSWORD:-vera}@postgres:5432/vera
      TOKEN_SECRET: ${TOKEN_SECRET}
      VERA_DAILY_GLOBAL_CAP_USD: ${VERA_DAILY_GLOBAL_CAP_USD:-2.0}
      BROKER_URL: ${BROKER_URL:-}
      BROKER_PROJECT_KEY: ${BROKER_PROJECT_KEY:-}
      # Для live-tool вызовов к ingestor-telegram (folder/dialog dump)
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set}
      TELEGRAM_TOOLS_URL: http://ingestor-telegram:8000
    ports:
      - "127.0.0.1:8002:8000"
    # до 200 строк с векторами по 1024 float из JSONB на запрос
    mem_limit: 320m
    restart: unless-stopped
    logging: *default-logging

  # ─── Telegram Bot ───────────────────────────────────────────────────────
  bot-telegram:
    build:
      context: ..
      dockerfile: services/bot-telegram/Dockerfile
    container_name: vera3-bot-telegram
    depends_on:
      brain-search:
        condition: service_started
      gateway:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://vera:${POSTGRES_PASSWORD:-vera}@postgres:5432/vera
      TOKEN_SECRET: ${TOKEN_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID}
      SEARCH_URL: http://brain-search:8000
      GATEWAY_URL: http://gateway:8000
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set}
    # aiogram, лонг-поллинг
    mem_limit: 160m
    restart: unless-stopped
    logging: *default-logging

  # ─── Gmail Ingestor ─────────────────────────────────────────────────────
  ingestor-gmail:
    build:
      context: ..
      dockerfile: services/ingestor-gmail/Dockerfile
    container_name: vera3-ingestor-gmail
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://vera:${POSTGRES_PASSWORD:-vera}@postgres:5432/vera
      TOKEN_SECRET: ${TOKEN_SECRET}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_POLL_S: 300
    # до MAX_PER_RUN=500 писем в пачке
    mem_limit: 192m
    restart: unless-stopped
    logging: *default-logging

  # ─── Telegram Userbot ───────────────────────────────────────────────────
  ingestor-telegram:
    build:
      context: ..
      dockerfile: services/ingestor-telegram/Dockerfile
    container_name: vera3-ingestor-telegram
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://vera:${POSTGRES_PASSWORD:-vera}@postgres:5432/vera
      TOKEN_SECRET: ${TOKEN_SECRET}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE}
      TELEGRAM_SESSION_DIR: /sessions
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set}
    volumes:
      - vera3_tg_sessions:/sessions
    expose:
      - "8000"
    # telethon + отдача медиа base64: raw 25 МБ + b64 33 + тело ответа 33
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging

  ingestor-instagram:
    # Отключён намеренно (2026-08-28, решение владельца): Instagram не
    # используем. Профиль `optional` держит сервис вне дефолтного
    # `docker compose up -d`, поэтому деплой его не поднимает. Вернуть —
    # убрать профиль или `docker compose --profile optional up -d ingestor-instagram`.
    # Убран и из vera3-monitor REQUIRED_CONTAINERS, чтобы не было ложных тревог.
    profiles: ["optional"]
    build:
      context: ..
      dockerfile: services/ingestor-instagram/Dockerfile
    container_name: vera3-ingestor-instagram
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://vera:${POSTGRES_PASSWORD:-vera}@postgres:5432/vera
      TOKEN_SECRET: ${TOKEN_SECRET}
      GATEWAY_URL: http://gateway:8000
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set}
      IG_POLL_INTERVAL_S: "90"
    # выключен профилем, лимит на случай возврата
    mem_limit: 192m
    restart: unless-stopped
    logging: *default-logging

  # ─── Trello ─────────────────────────────────────────────────────────────
  # Actions-фид всех досок владельца + суточный дайджест открытых сроков.
  # Ключ и токен — личные, из .env; состояние обхода в таблице trello_boards.
  ingestor-trello:
    build:
      context: ..
      dockerfile: services/ingestor-trello/Dockerfile
    container_name: vera3-ingestor-trello
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://vera:${POSTGRES_PASSWORD:-vera}@postgres:5432/vera
      # Без ключа контейнер не падает, а ждёт: обязательная переменная (:?)
      # уронила бы весь `compose up`, то есть всю Веру, из-за одного источника.
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      TRELLO_POLL_S: "300"
      TRELLO_BOOTSTRAP_DAYS: "7"
    mem_limit: 160m
    restart: unless-stopped
    logging: *default-logging

  ingestor-slack:
    build:
      context: ..
      dockerfile: services/ingestor-slack/Dockerfile
    container_name: vera3-ingestor-slack
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://vera:${POSTGRES_PASSWORD:-vera}@postgres:5432/vera
      # Токен подключается из дашборда и лежит в slack_auth зашифрованным —
      # без этого ключа контейнер его не расшифрует. Пропустил при вводе UI:
      # строка в БД была, а поллер писал «No TOKEN_SECRET available».
      TOKEN_SECRET: ${TOKEN_SECRET}
      # Запасной путь: если строки в slack_auth нет, токен берётся отсюда.
      # Без токена контейнер не падает, а ждёт: обязательная переменная (:?)
      # уронила бы весь `compose up`, то есть всю Веру, из-за одного источника.
      # Токен ПОЛЬЗОВАТЕЛЬСКИЙ (xoxp-): Вера должна видеть то, что видит Дима,
      # включая личку и приватные каналы, где бота нет.
      SLACK_USER_TOKEN: ${SLACK_USER_TOKEN:-}
      SLACK_POLL_S: "300"
      SLACK_BOOTSTRAP_DAYS: "7"
      # Тредов на канал за прогон и срок наблюдения. Потолки про расход
      # вызовов, не про полноту: тред проверяется реже, а не выпадает.
      SLACK_THREADS_PER_RUN: "20"
      SLACK_THREAD_WATCH_DAYS: "21"
      # Каналы, которые в мозг не идут вообще (через запятую, без #).
      SLACK_DENY_CHANNELS: ${SLACK_DENY_CHANNELS:-}
    mem_limit: 192m
    restart: unless-stopped
    logging: *default-logging

  # ─── Media Worker ───────────────────────────────────────────────────────
  # Polls triage_status='media_pending', downloads photo/voice via
  # ingestor-telegram /media/download, runs vision/whisper, appends
  # recognized text. Then triage_status='pending' → normal triage picks up.
  media-worker:
    build:
      context: ..
      dockerfile: services/media-worker/Dockerfile
    container_name: vera3-media-worker
    depends_on:
      postgres:
        condition: service_healthy
      ingestor-telegram:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://vera:${POSTGRES_PASSWORD:-vera}@postgres:5432/vera
      TOKEN_SECRET: ${TOKEN_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set}
      TELEGRAM_TOOLS_URL: http://ingestor-telegram:8000
      # Vision + whisper go through the broker — no provider keys here.
      BROKER_URL: ${BROKER_URL:-}
      BROKER_PROJECT_KEY: ${BROKER_PROJECT_KEY:-}
      MEDIA_POLL_S: "10"
      MEDIA_BATCH: "3"
    # приём того же медиа обратно: текст 33 + dict 33 + raw 25 + b64 33
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging

  # ─── Dashboard ──────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ..
      dockerfile: services/dashboard/Dockerfile
    container_name: vera3-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://vera:${POSTGRES_PASSWORD:-vera}@postgres:5432/vera
      TOKEN_SECRET: ${TOKEN_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-Dimondra_Ai_Bot}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID}
      # userbot re-auth flow (/api/telegram/*) — StringSession login
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE}
      SEARCH_URL: http://brain-search:8000
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      DASHBOARD_BASE_URL: https://dima.veranda.my
      # identity-судья и ярлыки кластеров зовут LLM из процесса дашборда
      BROKER_URL: ${BROKER_URL:-}
      BROKER_PROJECT_KEY: ${BROKER_PROJECT_KEY:-}
      # кнопка «подтянуть участников групп» → tools-сервер юзербота
      TELEGRAM_TOOLS_URL: http://ingestor-telegram:8000
    ports:
      - "127.0.0.1:8003:8000"
    # htmx-рендер + кэш статистики
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  # ─── Housekeeping ───────────────────────────────────────────────────────
  # Единственное место во всём стеке, где смонтирован docker.sock. Оправдание
  # ровно одно: убирать за собственными сборками, иначе диск съедается —
  # замер 2026-08-27 показал 4.76 ГБ невостребованных образов (82% всех).
  #
  # Раньше здесь стоял `docker system prune -af`, который чистит ВЕСЬ демон:
  # `-a` сносит любой образ, на который сейчас не смотрит контейнер, включая
  # тегированные образы aibroker и stepan2. То есть контейнер одного проекта
  # мог удалить артефакты двух чужих. infra/deploy.sh про это уже рассуждает
  # и сознательно выбирает безопасную пару — здесь теперь она же:
  #
  #   image prune -f (БЕЗ -a) — только висячие, без тега. Чужие проекты
  #     держат свои образы под тегами и не задеваются.
  #   builder prune --filter until=72h — кэш BuildKit общий на весь хост,
  #     фильтр по возрасту тут единственная защита.
  prune:
    image: docker:cli
    container_name: vera3-prune
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      sh -c "while true; do
        docker image prune -f || true;
        docker builder prune -f --filter until=72h || true;
        sleep 86400;
      done"
    # docker:cli, дёргает демон раз в сутки
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging

volumes:
  vera3_pgdata:
    driver: local
  vera3_tg_sessions:
    driver: local
