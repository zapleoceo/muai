# Зоны лимитов для /mcp. Директивы limit_req_zone / limit_conn_zone допустимы
# ТОЛЬКО в контексте http {}, поэтому это отдельный файл от location-сниппета:
#     # в /etc/nginx/nginx.conf внутри http { ... }, ДО подключения sites-enabled
#     include /var/www/vera3/infra/nginx/vera3-mcp-zones.conf;
# Без этой строки `nginx -t` на vera3-mcp.location.conf упадёт (нет зоны) — это
# намеренно: location без лимитов в бой не уходит.
#
# Ключи: по токену (Authorization) и по реальному IP клиента из Cloudflare.
# Пустой ключ nginx не учитывает, поэтому запрос без заголовка ловит вторая зона.
# Хост за Cloudflare: $remote_addr — адрес CF, а не клиента, потому ключ — CF-Connecting-IP.

limit_req_zone  $http_authorization    zone=vera_mcp_token:2m rate=5r/s;
limit_req_zone  $http_cf_connecting_ip zone=vera_mcp_ip:2m    rate=10r/s;
limit_conn_zone $http_authorization    zone=vera_mcp_conn:2m;
