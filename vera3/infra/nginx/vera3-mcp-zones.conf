# Контекст http {}: реальный IP клиента и зоны лимитов для /mcp.
# limit_req_zone / limit_conn_zone допустимы ТОЛЬКО в http {}, поэтому это
# отдельный файл от location-сниппета:
#     # в /etc/nginx/nginx.conf внутри http { ... }, ДО подключения sites-enabled
#     include /var/www/vera3/infra/nginx/vera3-mcp-zones.conf;
# Без этой строки `nginx -t` на vera3-mcp.location.conf упадёт (нет зоны) —
# это намеренно: location без лимитов в бой не уходит.
#
# Хост стоит за Cloudflare: без realip $remote_addr — адрес CF, и «лимит по IP»
# резал бы всех клиентов разом. Поэтому адрес берётся из CF-Connecting-IP, но
# ТОЛЬКО от доверенных адресов Cloudflare. Список — официальные диапазоны
# https://www.cloudflare.com/ips-v4 и https://www.cloudflare.com/ips-v6 (те же
# IPv4, что уже стоят в sites-enabled/aib; свериться с этими страницами при
# обновлении). Директивы действуют на все серверы хоста — для остальных
# виртуальных хостов это тот же настоящий IP клиента, ничего не ломается.
# Модуль realip в сборке nginx хоста есть (`nginx -V`: with-http_realip_module).

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Ключи: по токену (Authorization) и по реальному IP клиента. Пустой ключ nginx
# не учитывает, поэтому запрос без заголовка ловит зона по IP.
limit_req_zone  $http_authorization zone=vera_mcp_token:2m rate=5r/s;
limit_req_zone  $binary_remote_addr zone=vera_mcp_ip:2m    rate=10r/s;
limit_conn_zone $http_authorization zone=vera_mcp_conn:2m;
