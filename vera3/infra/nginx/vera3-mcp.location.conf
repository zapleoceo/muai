# Remote MCP: https://dima.veranda.my/mcp  →  vera3-mcp (127.0.0.1:8007).
#
# Подключается ОДНОЙ строкой внутри существующего server { ... } хоста vera:
#     include /var/www/vera3/infra/nginx/vera3-mcp.location.conf;
# затем `nginx -t && systemctl reload nginx`. Остальные location не трогаются.
#
# Почему не как `/v1/`: MCP Streamable HTTP отвечает потоком (SSE) и может
# держать соединение — буферизация nginx склеила бы события и сломала клиент.
# TLS кончается на Cloudflare, поэтому Proto зашит как https (как в остальных
# location этого хоста). Аутентификация — bearer-токен на стороне сервиса; nginx её не дублирует.

location = /mcp {
    proxy_pass http://127.0.0.1:8007;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 4m;
}

location /mcp/ {
    proxy_pass http://127.0.0.1:8007;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 4m;
}
