[project]
name = "vera-mcp-hub"
version = "0.1.0"
description = "Vera 3.0 — MCP hub: one MCP endpoint for agents, upstream MCP servers grouped by project"
requires-python = ">=3.12"
dependencies = [
    "vera-shared",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_hub"]
