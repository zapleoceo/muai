[project]
name = "vera-mcp"
version = "0.1.0"
description = "Vera 3.0 — remote MCP server (Streamable HTTP) over the brain database"
requires-python = ">=3.12"
dependencies = [
    "vera-shared",
    "mcp>=2.3,<3",
    "standardwebhooks==1.1.0",
    "httpx>=0.27",
    "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_mcp"]
