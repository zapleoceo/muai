[project]
name = "vera-mcp"
version = "0.1.0"
description = "Vera 3.0 — remote MCP server (Streamable HTTP) over the brain database"
requires-python = ">=3.12"
dependencies = [
    "vera-shared",
    # v2 переименовал FastMCP в MCPServer и сломал API — держим 1.x
    "mcp>=1.9,<2",
    "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_mcp"]
