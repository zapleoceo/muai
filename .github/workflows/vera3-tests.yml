name: Vera 3.0 Tests

on:
  push:
    branches: [master, main]
    paths:
      - 'vera3/**'
      - '.github/workflows/vera3-tests.yml'
  pull_request:
    paths:
      - 'vera3/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vera3
    # Тот же живой Postgres, что в deploy.yml: без него tests/integration
    # молча пропускаются, а именно там проверяется весь Postgres-only SQL
    # (SKIP LOCKED, to_tsvector, FILTER, ->>). Образ как в проде.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vera
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vera -d vera_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install shared lib
        run: pip install -e ./shared[dev] aiosqlite

      - name: Install gateway
        run: pip install -e ./services/gateway[dev]

      - name: Install dashboard
        # test_favicon imports the dashboard package — without this it can't be collected.
        run: pip install -e ./services/dashboard

      - name: Install media-worker
        # test_media_worker imports the media_worker package.
        run: pip install -e ./services/media-worker

      - name: Install ingestor-telegram
        # test_userbot_chat_kind imports the ingestor_telegram package.
        run: pip install -e ./services/ingestor-telegram

      - name: Install bot-telegram
        # test_security_pack.py imports bot_telegram.bot, which imports aiogram
        # (a real pip dependency, not on PYTHONPATH-only like the in-repo
        # packages below) — without this the whole test job fails to collect.
        run: pip install -e ./services/bot-telegram

      - name: Install brain-search
        # Not in --cov below: repo-wide fail-under would retroactively fail
        # on its pre-existing legacy coverage gap. Tests still collect/run —
        # regressions in brain_search fail this job either way.
        run: pip install -e ./services/brain-search

      - name: Run all tests with coverage
        env:
          TELEGRAM_API_ID: "1"
          TELEGRAM_API_HASH: "test"
          TELEGRAM_PHONE: "+10000000000"
          RUN_INTEGRATION_TESTS: "1"
          TEST_DATABASE_URL: postgresql+asyncpg://vera:test@localhost:5432/vera_test
        run: |
          # PYTHONPATH здесь НЕ задаётся: tests/unit/conftest.py сам кладёт в
          # sys.path shared и все services/*/src. Раньше список жил в трёх
          # копиях в двух воркфлоу и разъехался — у шага diff-cover не было
          # brain-triage, сборка тестов падала, а деплой стоял молча.
          # Пороги по пакетам, а не один процент — см. scripts/check_coverage.py.
          pytest tests/ \
            --cov=vera_shared --cov=gateway --cov=media_worker \
            --cov=brain_search --cov=brain_triage --cov=dashboard \
            --cov=ingestor_gmail --cov=ingestor_slack --cov=ingestor_trello \
            --cov=ingestor_telegram --cov=bot_telegram \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
          python scripts/check_coverage.py coverage.xml

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check shared services tests --output-format=github
        continue-on-error: true  # warning, not blocking yet

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy shared/vera_shared --ignore-missing-imports
        continue-on-error: true  # warning, not blocking yet

  # На PR — единственное место, где образы вообще собираются: deploy.yml
  # запускается только на master. Раньше здесь строился ровно один Dockerfile
  # из одиннадцати (gateway), да ещё и под `if: master`, то есть на PR не
  # собиралось НИЧЕГО, а на master — одно из одиннадцати.
  build-images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false        # хотим видеть ВСЕ сломанные образы за прогон
      matrix:
        service:
          - bot-telegram
          - brain-search
          - brain-triage
          - dashboard
          - gateway
          - ingestor-gmail
          - ingestor-instagram
          - ingestor-slack
          - ingestor-telegram
          - ingestor-trello
          - media-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: vera3
          file: vera3/services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
