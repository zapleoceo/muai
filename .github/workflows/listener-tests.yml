name: vera-listener tests

on:
  push:
    paths:
      - 'vera-listener/**'
      - '.github/workflows/listener-tests.yml'
  pull_request:
    paths:
      - 'vera-listener/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vera-listener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vera-listener/requirements-test.txt
      - name: Install test deps
        # Пакет целиком не ставим: soundcard/pycaw — Windows-only, их подменяет
        # tests/conftest.py. Список зависимостей один — requirements-test.txt.
        run: pip install -r requirements-test.txt
      - name: Pytest
        run: PYTHONPATH=src pytest tests -q
      - name: Ruff
        run: ruff check --select E,F,W,I,B,UP,SIM,C4,RET --ignore E501 src tests
