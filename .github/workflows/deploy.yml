name: Deploy vera3 to Hetzner

on:
  push:
    branches: [master]
    paths:
      - 'vera3/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── 1. Docs gate ────────────────────────────────────────────────────────
  # Blocks deploy if vera3/services or vera3/shared changed without
  # vera3/docs being updated. Opt-out per commit: `docs-not-needed`.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify vera3/docs updated alongside code
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse "${HEAD}~1" 2>/dev/null || echo "$HEAD")"
          fi
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "changed files:"; echo "$CHANGED"

          if git log --format=%B "${BASE}..${HEAD}" 2>/dev/null | grep -qiF "docs-not-needed"; then
            echo "::notice::'docs-not-needed' marker found, skipping docs gate"
            exit 0
          fi

          CODE="$(echo "$CHANGED" | grep -E '^vera3/(services|shared)/' || true)"
          DOCS="$(echo "$CHANGED" | grep -E '^vera3/docs/' || true)"
          if [ -n "$CODE" ] && [ -z "$DOCS" ]; then
            echo "::error::Code changed in vera3/services or vera3/shared but vera3/docs was not updated."
            echo "Update the relevant doc OR add 'docs-not-needed' to a commit message."
            exit 1
          fi
          echo "docs gate passed"

  # ─── 2. Test gate ────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vera3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ./shared[dev] aiosqlite
          pip install -e ./services/gateway[dev]
          pip install -e ./services/dashboard
          pip install -e ./services/media-worker
          pip install -e ./services/ingestor-telegram
          pip install -e ./services/ingestor-gmail
          pip install -e ./services/ingestor-trello
          pip install -e ./services/ingestor-slack
          pip install -e ./services/brain-search
          pip install -e ./services/bot-telegram
      - name: Pytest
        # Coverage gate stair-step. 2026-06-24: 40 → 60 → 70 (246 passed, 74.17%)
        env:
          TELEGRAM_API_ID: "1"
          TELEGRAM_API_HASH: "test"
          TELEGRAM_PHONE: "+10000000000"
        run: |
          # brain_search intentionally NOT in --cov here: repo-wide 70% gate
          # would retroactively fail on its pre-existing legacy coverage gap.
          # It IS collected/run (regressions still fail this job) and IS
          # covered by the quality job's diff-cover (new-lines-only, below).
          # PYTHONPATH здесь НЕ задаётся: tests/unit/conftest.py сам кладёт в
          # sys.path shared и все services/*/src. Раньше список жил в трёх
          # копиях в двух воркфлоу и разъехался — у шага diff-cover не было
          # brain-triage, сборка тестов падала, а деплой стоял молча.
          pytest tests/ \
            --cov=vera_shared --cov=gateway \
            --cov-report=term-missing \
            --cov-fail-under=70

  # ─── 3. Quality gate ─────────────────────────────────────────────────────
  # Strict static analysis on the diff:
  #   (a) Ruff with extended ruleset (E,F,W,I,B,UP,SIM,C4,RET) — no warnings.
  #   (b) Vulture — flags dead/unused code in files touched by this push.
  #   (c) Diff-cover — ≥75% line coverage on the diff itself (not just repo total).
  #   (d) Docs-name sync — every newly-added public symbol (def foo / class Bar)
  #       must appear in vera3/docs/*; every removed symbol must NOT remain there.
  # Opt-out per commit: `docs-not-needed` (skips d only).
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ./vera3/shared[dev] aiosqlite
          pip install -e ./vera3/services/gateway[dev]
          pip install -e ./vera3/services/dashboard
          pip install -e ./vera3/services/media-worker
          pip install -e ./vera3/services/ingestor-telegram
          pip install -e ./vera3/services/ingestor-gmail
          pip install -e ./vera3/services/ingestor-trello
          pip install -e ./vera3/services/ingestor-slack
          pip install -e ./vera3/services/brain-search
          pip install -e ./vera3/services/bot-telegram
          pip install vulture==2.13 diff-cover==9.2.0 ruff==0.7.4

      - name: Compute diff base
        id: base
        shell: bash
        run: |
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse "${HEAD}~1" 2>/dev/null || echo "$HEAD")"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "Diff base: $BASE → $HEAD"

      - name: Secret scan (no credentials in the diff)
        # 2026-07-15 incident: the Telegram bot token was committed twice —
        # once hardcoded as a config default, once captured into
        # .claude/settings.local.json by running `curl .../bot<TOKEN>/getMe`
        # (the allowlist stores the whole command). It was later used to spam
        # from the bot and rewrite its description. This scans ADDED lines
        # only — history still holds that (long-revoked) token, so a
        # full-history scan would fail every run forever without adding
        # safety. Patterns are high-signal shapes, not entropy guesses, so a
        # hit is a real credential, not a false alarm.
        shell: bash
        run: |
          BASE="${{ steps.base.outputs.base }}"
          HEAD="${{ steps.base.outputs.head }}"
          ADDED="$(git diff "$BASE" "$HEAD" | grep -E '^\+' | grep -v '^\+\+\+' || true)"
          PATTERNS='[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,}'
          if HITS="$(echo "$ADDED" | grep -nEo "$PATTERNS" | sed -E 's/(.{12}).*/\1…<redacted>/')" && [ -n "$HITS" ]; then
            echo "::error::A credential appears in this diff — do NOT push it."
            echo "$HITS"
            echo "Revoke the exposed credential first, then remove it from the change."
            exit 1
          fi
          echo "✓ no credentials in the diff"

      - name: Ruff (strict, changed files only)
        # E501 line-too-long excluded — no formatter on the project yet.
        # Legacy code is grandfathered: only files touched by this push
        # get the strict treatment, so new code stays clean without a
        # 1000-file fix-everything migration.
        shell: bash
        run: |
          BASE="${{ steps.base.outputs.base }}"
          HEAD="${{ steps.base.outputs.head }}"
          CHANGED="$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" \
                      | grep -E '^vera3/(services|shared|tests)/.*\.py$' || true)"
          if [ -z "$CHANGED" ]; then
            echo "No changed .py files — skip ruff"
            exit 0
          fi
          echo "Linting:"; echo "$CHANGED"
          # B008 ignored: Depends()/Query()/File() in FastAPI param defaults
          # is THE idiomatic pattern (ruff docs recommend ignoring it for
          # FastAPI). Matches AIbroker's config.
          # RUF006 (dangling create_task): ловит фоновую задачу, созданную без
          # ссылки — цикл держит на неё только слабую, GC может собрать её на
          # полпути. Проект защищается от этого руками в шести местах, и ровно
          # в двух самых важных (watchdog и retry-цикл триажа) забыл. Линтер
          # дешевле, чем ещё один такой пропуск.
          echo "$CHANGED" | xargs ruff check \
            --select E,F,W,I,B,UP,SIM,C4,RET,RUF006 --ignore E501,E402,B008

      - name: Vulture (dead-code on changed files)
        shell: bash
        run: |
          BASE="${{ steps.base.outputs.base }}"
          HEAD="${{ steps.base.outputs.head }}"
          CHANGED="$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" \
                      | grep -E '^vera3/(services|shared)/.*\.py$' || true)"
          if [ -z "$CHANGED" ]; then
            echo "No Python changes under vera3/services|shared — skip."
            exit 0
          fi
          echo "Scanning:"; echo "$CHANGED"
          # --min-confidence 80 is conservative; raises only when 4/5 sure.
          # --ignore-names cls: vulture считает `cls` в @classmethod неиспользуемой
          # переменной, хотя это обязательный параметр языка. Так выглядит каждый
          # валидатор pydantic, и ловушка вылезает при ПЕРВОМ касании файла:
          # events/schema.py жил с двумя такими валидаторами — ворота их не видели,
          # потому что линтуются только изменённые файлы, — а на третьем деплой упал.
          echo "$CHANGED" | xargs vulture --min-confidence 80 --ignore-names cls \
            --exclude '*/tests/*,*/__init__.py' || {
              echo "::warning::Vulture found suspected dead code — see above."
              exit 1
            }

      - name: Diff-cover (≥75% on new lines)
        # Only the lines this push changed need ≥75% coverage. Total-repo
        # gate (70%) handled separately by the test job. Skips automatically
        # when the diff has no .py files.
        shell: bash
        run: |
          BASE="${{ steps.base.outputs.base }}"
          HEAD="${{ steps.base.outputs.head }}"
          if ! git diff --name-only "$BASE" "$HEAD" | grep -qE '^vera3/.*\.py$'; then
            echo "No .py changes — skip diff-cover"
            exit 0
          fi
          cd vera3
          export TELEGRAM_API_ID=1 TELEGRAM_API_HASH=test TELEGRAM_PHONE=+10000000000
          # PYTHONPATH здесь НЕ задаётся: tests/unit/conftest.py сам кладёт в
          # sys.path shared и все services/*/src. Раньше список жил в трёх
          # копиях в двух воркфлоу и разъехался — у шага diff-cover не было
          # brain-triage, сборка тестов падала, а деплой стоял молча.
            pytest tests/ -q --no-header \
              --cov=vera_shared --cov=gateway --cov=media_worker --cov=brain_search \
              --cov-report=xml:coverage.xml -p no:cacheprovider \
              || { echo "pytest exit $?"; exit 1; }
          # Compare against the parent commit on the same branch.
          diff-cover coverage.xml \
            --compare-branch="$BASE" \
            --fail-under=75

      - name: Docs name-sync
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.base.outputs.base }}"
          HEAD="${{ steps.base.outputs.head }}"
          if git log --format=%B "${BASE}..${HEAD}" 2>/dev/null | grep -qiF "docs-not-needed"; then
            echo "::notice::'docs-not-needed' marker — skip docs name-sync"
            exit 0
          fi
          # Public names = lowercase def + PascalCase class. Skip _private, test_, dunder.
          # Also skip generic entrypoint/lifecycle names (main/run/... — every
          # service has a `def main()`): they're not documentable API symbols,
          # and the literal-grep below false-positives on the common word "main"
          # scattered across docs (main loop, main.py, git main) whenever such a
          # file is added or deleted.
          # `Source` — по той же причине, что `main`: это обычное английское
          # слово, которое стоит в доках повсюду («Source pushes an envelope»,
          # «Source-specific config»), поэтому проверка на осиротевшее
          # упоминание срабатывала бы ложно при любом удалении такого класса.
          SKIP='^test_|^_|^(main|run|serve|create_app|lifespan|healthz|startup|shutdown|Source)$'
          NAME_RE='^[+-](async )?def [a-z][a-z0-9_]*\(|^[+-]class [A-Z][A-Za-z0-9_]*[\(:]'
          DIFF="$(git diff "$BASE" "$HEAD" -- 'vera3/services/**/*.py' 'vera3/shared/**/*.py' || true)"
          ADDED="$(echo "$DIFF" | grep -E "^\+" | grep -E "$NAME_RE" \
                    | sed -E 's/^\+(async )?def ([a-z][a-z0-9_]*)\(.*/\2/;
                              s/^\+class ([A-Z][A-Za-z0-9_]*).*/\1/' \
                    | grep -vE "$SKIP" | sort -u || true)"
          REMOVED="$(echo "$DIFF" | grep -E "^-" | grep -E "$NAME_RE" \
                      | sed -E 's/^-(async )?def ([a-z][a-z0-9_]*)\(.*/\2/;
                                s/^-class ([A-Z][A-Za-z0-9_]*).*/\1/' \
                      | grep -vE "$SKIP" | sort -u || true)"
          NET_ADDED="$(comm -23 <(echo "$ADDED") <(echo "$REMOVED") | grep -v '^$' || true)"
          NET_REMOVED="$(comm -23 <(echo "$REMOVED") <(echo "$ADDED") | grep -v '^$' || true)"
          fail=0
          if [ -n "$NET_ADDED" ]; then
            echo "Added public names: $NET_ADDED"
            for name in $NET_ADDED; do
              # По границам слова, а не подстрокой: иначе удаление `Foo`
              # «находится» в доке, где упомянут только `FooBar`.
              if ! grep -rqE -- "\b$name\b" vera3/docs/ 2>/dev/null; then
                echo "::error::Added public symbol '$name' not mentioned anywhere in vera3/docs/"
                fail=1
              fi
            done
          fi
          if [ -n "$NET_REMOVED" ]; then
            echo "Removed public names: $NET_REMOVED"
            for name in $NET_REMOVED; do
              if grep -rqE -- "\b$name\b" vera3/docs/ 2>/dev/null; then
                echo "::error::Removed symbol '$name' still referenced in vera3/docs/ (orphan)"
                fail=1
              fi
            done
          fi
          [ "$fail" -eq 0 ] && echo "docs name-sync passed"
          exit $fail

  # ─── 3b. Build gate ──────────────────────────────────────────────────────
  # Каждый образ должен собираться ДО того, как деплой начнёт их пересобирать
  # на боевом хосте. Раньше в CI собирался ровно один Dockerfile из
  # одиннадцати — gateway, и то в другом воркфлоу (vera3-tests.yml), которого
  # нет в needs у деплоя. То есть сломанный Dockerfile или неразрешимая
  # зависимость выяснялись уже на проде, в промежутке между «ворота зелёные»
  # и «сервис не поднялся». Опрос /healthz после деплоя ловит только gateway.
  #
  # Пуша нет — только сборка. Образы всё равно собираются на хосте: цель
  # гейта — отделить «код не собирается» от «код не работает».
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false          # хотим видеть ВСЕ сломанные образы за один прогон
      matrix:
        service:
          - bot-telegram
          - brain-search
          - brain-triage
          - dashboard
          - gateway
          - ingestor-gmail
          - ingestor-instagram
          - ingestor-slack
          - ingestor-telegram
          - ingestor-trello
          - media-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: vera3
          file: vera3/services/${{ matrix.service }}/Dockerfile
          push: false
          # Кэш на слой GitHub Actions: без него одиннадцать pip install
          # заново на каждый пуш — минуты, которые никому не нужны.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ─── 4. Deploy ───────────────────────────────────────────────────────────
  # Hard-gated: docs + tests + quality + build must ALL pass.
  deploy:
    needs: [docs, test, quality, build]
    runs-on: ubuntu-latest
    # 25, а не 15: опрос занятого замка до десяти минут плюс сам деплой до
    # семи в прежний бюджет не влезали, а упор в таймаут даёт cancelled —
    # то есть тихий провал, который уведомление раньше не ловило.
    timeout-minutes: 25
    env:
      HOST: ${{ secrets.HETZNER_HOST }}
      PORT: ${{ secrets.HETZNER_PORT || '9617' }}

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Prefer the restricted key (vera3-only, command=...).
          # Falls back to the old full-root key if the new secret isn't set yet.
          # After you add HETZNER_SSH_KEY_VERA3 in repo settings, the old one
          # can be deleted.
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY_VERA3 || secrets.HETZNER_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Trigger restricted deploy
        # The SSH key is wired to `command="/usr/local/bin/vera3-deploy"` on
        # the server — connecting at all runs git-pull + rsync vera3/ + compose
        # up. Any other command the client passes is ignored. Worst-case key
        # leak = attacker can re-run our own deploy, nothing else.
        #
        # Код 15 — «другой деплой уже идёт» (замок на сервере). Это не поломка:
        # ручной прогон или второй раннер держит замок. Ждём и пробуем ещё раз,
        # а НЕ проглатываем молча: молчаливый пропуск означал бы, что пуш не
        # задеплоился и об этом никто не узнал. Не удалось со второго раза —
        # падаем громко. Код 17 (замок сломан) повтору не подлежит: это уже
        # инфраструктура, и глотать его вместе с 15 нельзя.
        run: |
          deploy() {
            ssh -p "$PORT" -o ServerAliveInterval=30 \
                -o BatchMode=yes -o ConnectTimeout=15 \
                root@"$HOST"
          }
          deploy && exit 0
          rc=$?
          if [ "$rc" -ne 15 ]; then
            echo "::error::деплой упал с кодом $rc"
            exit "$rc"
          fi
          # Полный деплой идёт 3–7 минут, поэтому одного повтора мало: ждём в
          # опросе до пяти раз по 120с. Дольше не тянем — упрёмся в
          # timeout-minutes, а таймаут даёт cancelled, который надо ловить
          # отдельно (см. job notify).
          for attempt in 1 2 3 4 5; do
            echo "::notice::замок занят другим деплоем — попытка $attempt, жду 120с"
            sleep 120
            deploy && exit 0
            rc=$?
            if [ "$rc" -ne 15 ]; then
              echo "::error::деплой упал с кодом $rc"
              exit "$rc"
            fi
          done
          echo "::error::замок занят больше десяти минут — деплой не прошёл"
          exit 15

      - name: HTTPS probe (best-effort)
        run: |
          curl -sf -o /dev/null -w "HTTPS dashboard: %{http_code}\n" \
            https://dima.veranda.my/login | grep -qE "200|303" \
            || echo "(CF probe failed but origin was healthy at deploy end)"

  # ─── 5. Уведомление о ЛЮБОМ падении ──────────────────────────────────────
  # Отдельный job, а не шаг внутри deploy: при красном гейте job deploy не
  # запускается вовсе, поэтому шаг внутри него не срабатывал — падение гейта
  # проходило молча. Реальный случай 2026-08-27: у шага diff-cover разъехался
  # PYTHONPATH, сборка тестов падала, деплой стоял на ЧЕТЫРЁХ коммитах, и
  # узналось это только когда кто-то заметил, что сервер отстал.
  notify:
    needs: [docs, test, quality, build, deploy]
    # cancelled обязателен наравне с failure: при упоре в timeout-minutes
    # GitHub помечает job как cancelled, и условие только на failure пропускало
    # бы ровно тот случай, от которого этот job и написан — «деплой встал, и
    # никто не узнал». Нашло ревью.
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    steps:
      - name: Написать владельцу, что и где упало
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_VERA }}
          OWNER_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_DOCS: ${{ needs.docs.result }}
          R_TEST: ${{ needs.test.result }}
          R_QUALITY: ${{ needs.quality.result }}
          R_BUILD: ${{ needs.build.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
        run: |
          [ -z "$BOT_TOKEN" ] && exit 0
          [ -z "$OWNER_ID" ] && exit 0
          FAILED=""
          for pair in "docs:$R_DOCS" "test:$R_TEST" "quality:$R_QUALITY" "build:$R_BUILD" "deploy:$R_DEPLOY"; do
            case "${pair#*:}" in failure) FAILED="$FAILED ${pair%%:*}";; esac
          done
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
               -d "chat_id=${OWNER_ID}" \
               -d "text=vera3: деплой НЕ прошёл. Упало:${FAILED}%0A${RUN_URL}" \
               -o /dev/null || true
