name: Deploy vera3 to Hetzner

# Единственный воркфлоу vera3: docs → quality → test → build → deploy.
# Раньше то же самое делали три файла (deploy.yml, vera3-tests.yml,
# docs-check.yml): docs-гейт, pytest с покрытием и сборка одиннадцати образов
# гонялись по два раза на каждый пуш. Теперь каждая работа выполняется один
# раз; на PR идёт всё, кроме deploy.
#
# Имя воркфлоу "Deploy vera3 to Hetzner" и id job'ов (docs, quality, test,
# build, deploy, notify) не менять: по ним воркфлоу ищут снаружи.

on:
  push:
    branches: [master]
    paths:
      - 'vera3/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'vera3/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# PR получает свою группу на ветку и отменяет устаревшие прогоны. Всё, что
# ведёт в продакшн (push в master, ручной запуск), стоит в общей очереди и
# НИКОГДА не отменяется: отмена посреди deploy оставила бы сервер на
# полпути между rsync и compose up.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Вход для vera3/scripts/ci_diff_base.sh: без ${{ }} внутри shell-кода.
  CI_EVENT: ${{ github.event_name }}
  CI_BEFORE: ${{ github.event.before }}
  CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
  CI_HEAD: ${{ github.sha }}

jobs:
  # ─── 1. Docs gate ────────────────────────────────────────────────────────
  # Blocks the run if vera3/services or vera3/shared changed without
  # vera3/docs being updated. Opt-out per commit: `docs-not-needed`.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify vera3/docs updated alongside code
        shell: bash
        run: |
          BASE="$(bash vera3/scripts/ci_diff_base.sh)"
          bash vera3/scripts/ci_gate_docs.sh "$BASE" "$CI_HEAD"

  # ─── 2. Quality gate ─────────────────────────────────────────────────────
  # Strict static analysis on the diff (no tests here — coverage is in `test`):
  #   (a) Secret scan on added lines.
  #   (b) Ruff with extended ruleset (E,F,W,I,B,UP,SIM,C4,RET) — no warnings.
  #   (c) Vulture — flags dead/unused code in files touched by this push.
  #   (d) Docs-name sync — every newly-added public symbol (def foo / class Bar)
  #       must appear in vera3/docs/*; every removed symbol must NOT remain there.
  # Opt-out per commit: `docs-not-needed` (skips d only).
  quality:
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vera3/scripts/ci_install.sh
      - name: Install
        run: bash vera3/scripts/ci_install.sh lint

      - name: Compute diff base
        id: base
        shell: bash
        run: |
          BASE="$(bash vera3/scripts/ci_diff_base.sh)"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$CI_HEAD" >> "$GITHUB_OUTPUT"
          echo "Diff base: $BASE → $CI_HEAD (event: $CI_EVENT)"

      - name: Secret scan (no credentials in the diff)
        # 2026-07-15 incident: the Telegram bot token was committed twice —
        # once hardcoded as a config default, once captured into
        # .claude/settings.local.json by running `curl .../bot<TOKEN>/getMe`
        # (the allowlist stores the whole command). It was later used to spam
        # from the bot and rewrite its description. This scans ADDED lines
        # only — history still holds that (long-revoked) token, so a
        # full-history scan would fail every run forever without adding
        # safety. Patterns are high-signal shapes, not entropy guesses, so a
        # hit is a real credential, not a false alarm.
        shell: bash
        run: |
          bash vera3/scripts/ci_gate_secrets.sh "${{ steps.base.outputs.base }}" "${{ steps.base.outputs.head }}"

      - name: Ruff (strict, changed files only)
        # E501 line-too-long excluded — no formatter on the project yet.
        # Legacy code is grandfathered: only files touched by this push
        # get the strict treatment, so new code stays clean without a
        # 1000-file fix-everything migration.
        shell: bash
        run: |
          bash vera3/scripts/ci_gate_ruff.sh "${{ steps.base.outputs.base }}" "${{ steps.base.outputs.head }}"

      - name: Vulture (dead-code on changed files)
        shell: bash
        run: |
          bash vera3/scripts/ci_gate_vulture.sh "${{ steps.base.outputs.base }}" "${{ steps.base.outputs.head }}"

      - name: Docs name-sync
        shell: bash
        run: |
          bash vera3/scripts/ci_gate_docs_namesync.sh "${{ steps.base.outputs.base }}" "${{ steps.base.outputs.head }}"

  # ─── 3. Test gate ────────────────────────────────────────────────────────
  # Один прогон pytest на весь воркфлоу: из его coverage.xml берутся и пороги
  # по пакетам (check_coverage.py), и diff-cover на новых строках.
  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Живой Postgres. Юнит-тесты идут на SQLite (быстро, без сервиса), но
    # весь сырой SQL проекта — Postgres-only и на SQLite физически не
    # исполняется: to_tsvector, FOR UPDATE SKIP LOCKED, FILTER (WHERE …),
    # metadata->>, = ANY(:ids), NOW(). Без него tests/pg и tests/integration
    # молча пропускаются, а Postgres-only строки считаются непокрытыми — так
    # diff-cover на SQLite выдавал 63% вместо 88% и блокировал деплой.
    # Образ тот же, что в проде (pgvector/pgvector:pg16).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vera
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vera -d vera_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TELEGRAM_API_ID: "1"
      TELEGRAM_API_HASH: "test"
      TELEGRAM_PHONE: "+10000000000"
      # Включает tests/pg и tests/integration. Без этих двух переменных
      # они молча пропускаются — так они и простояли мёртвыми в CI.
      RUN_INTEGRATION_TESTS: "1"
      TEST_DATABASE_URL: postgresql+asyncpg://vera:test@localhost:5432/vera_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # diff-cover сравнивает с базой диффа
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vera3/scripts/ci_install.sh
      - name: Install
        run: bash vera3/scripts/ci_install.sh test

      - name: Pytest + per-package coverage floors
        working-directory: vera3
        run: |
          # PYTHONPATH здесь НЕ задаётся: tests/unit/conftest.py сам кладёт в
          # sys.path shared и все services/*/src.
          # ВСЕ пакеты под измерением, и порог у каждого свой — см.
          # scripts/check_coverage.py. Один общий процент по двум пакетам из
          # двенадцати описывал 38.8% продового кода.
          pytest tests/ \
            --cov=vera_shared --cov=gateway --cov=media_worker \
            --cov=brain_search --cov=brain_triage --cov=dashboard \
            --cov=ingestor_gmail --cov=ingestor_slack --cov=ingestor_trello \
            --cov=ingestor_telegram --cov=bot_telegram --cov=vera_mcp \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
          python scripts/check_coverage.py coverage.xml

      - name: Diff-cover (≥75% on new lines)
        # Only the lines this change touched need ≥75% coverage. Skips
        # automatically when the diff has no .py files.
        shell: bash
        run: |
          BASE="$(bash vera3/scripts/ci_diff_base.sh)"
          if ! git diff --name-only "$BASE" "$CI_HEAD" | grep -qE '^vera3/.*\.py$'; then
            echo "No .py changes — skip diff-cover"
            exit 0
          fi
          cd vera3
          # Раньше diff-cover имел собственный прогон pytest с четырьмя
          # --cov (shared, gateway, media-worker, brain-search). Чтобы гейт не
          # стал строже после слияния прогонов, отчёт сужается до тех же
          # четырёх пакетов: у файлов остальных пакетов в диффе по-прежнему
          # нет порога на строки (на них есть пакетные пороги check_coverage.py).
          python -m coverage xml \
            --include='*/shared/vera_shared/*,*/services/gateway/*,*/services/media-worker/*,*/services/brain-search/*,*/services/mcp/*' \
            -o coverage-diffcover.xml
          diff-cover coverage-diffcover.xml \
            --compare-branch="$BASE" \
            --fail-under=75

      - name: Lint whole tree with ruff (informational)
        working-directory: vera3
        run: ruff check shared services tests --output-format=github
        continue-on-error: true  # warning, not blocking yet

      - name: Type check with mypy (informational)
        working-directory: vera3
        run: mypy shared/vera_shared --ignore-missing-imports
        continue-on-error: true  # warning, not blocking yet

  # ─── 4. Build gate ───────────────────────────────────────────────────────
  # Каждый образ должен собираться ДО того, как деплой начнёт их пересобирать
  # на боевом хосте. Пуша нет — только сборка. Образы всё равно собираются на
  # хосте: цель гейта — отделить «код не собирается» от «код не работает».
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false          # хотим видеть ВСЕ сломанные образы за один прогон
      matrix:
        service:
          - bot-telegram
          - brain-search
          - brain-triage
          - dashboard
          - gateway
          - mcp
          - ingestor-gmail
          - ingestor-instagram
          - ingestor-slack
          - ingestor-telegram
          - ingestor-trello
          - media-worker
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: vera3
          file: vera3/services/${{ matrix.service }}/Dockerfile
          push: false
          # Кэш на слой GitHub Actions: без него одиннадцать pip install
          # заново на каждый пуш — минуты, которые никому не нужны.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ─── 5. Deploy ───────────────────────────────────────────────────────────
  # Только push в master (или ручной запуск на master); needs — все гейты.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [docs, quality, test, build]
    runs-on: ubuntu-latest
    # 25, а не 15: опрос занятого замка до десяти минут плюс сам деплой до
    # семи в прежний бюджет не влезали, а упор в таймаут даёт cancelled —
    # то есть тихий провал, который уведомление раньше не ловило.
    timeout-minutes: 25
    env:
      HOST: ${{ secrets.HETZNER_HOST }}
      PORT: ${{ secrets.HETZNER_PORT || '9617' }}

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          # Prefer the restricted key (vera3-only, command=...).
          # Falls back to the old full-root key if the new secret isn't set yet.
          # After you add HETZNER_SSH_KEY_VERA3 in repo settings, the old one
          # can be deleted.
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY_VERA3 || secrets.HETZNER_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Trigger restricted deploy
        # The SSH key is wired to `command="/usr/local/bin/vera3-deploy"` on
        # the server — connecting at all runs git-pull + rsync vera3/ + compose
        # up. Any other command the client passes is ignored. Worst-case key
        # leak = attacker can re-run our own deploy, nothing else.
        #
        # Код 15 — «другой деплой уже идёт» (замок на сервере). Это не поломка:
        # ручной прогон или второй раннер держит замок. Ждём и пробуем ещё раз,
        # а НЕ проглатываем молча: молчаливый пропуск означал бы, что пуш не
        # задеплоился и об этом никто не узнал. Не удалось со второго раза —
        # падаем громко. Код 17 (замок сломан) повтору не подлежит: это уже
        # инфраструктура, и глотать его вместе с 15 нельзя.
        run: |
          deploy() {
            ssh -p "$PORT" -o ServerAliveInterval=30 \
                -o BatchMode=yes -o ConnectTimeout=15 \
                root@"$HOST"
          }
          deploy && exit 0
          rc=$?
          if [ "$rc" -ne 15 ]; then
            echo "::error::деплой упал с кодом $rc"
            exit "$rc"
          fi
          # Полный деплой идёт 3–7 минут, поэтому одного повтора мало: ждём в
          # опросе до пяти раз по 120с. Дольше не тянем — упрёмся в
          # timeout-minutes, а таймаут даёт cancelled, который надо ловить
          # отдельно (см. job notify).
          for attempt in 1 2 3 4 5; do
            echo "::notice::замок занят другим деплоем — попытка $attempt, жду 120с"
            sleep 120
            deploy && exit 0
            rc=$?
            if [ "$rc" -ne 15 ]; then
              echo "::error::деплой упал с кодом $rc"
              exit "$rc"
            fi
          done
          echo "::error::замок занят больше десяти минут — деплой не прошёл"
          exit 15

      - name: HTTPS probe (best-effort)
        run: |
          curl -sf -o /dev/null -w "HTTPS dashboard: %{http_code}\n" \
            https://dima.veranda.my/login | grep -qE "200|303" \
            || echo "(CF probe failed but origin was healthy at deploy end)"

  # ─── 6. Уведомление о ЛЮБОМ падении ──────────────────────────────────────
  # Отдельный job, а не шаг внутри deploy: при красном гейте job deploy не
  # запускается вовсе, поэтому шаг внутри него не срабатывал — падение гейта
  # проходило молча. Реальный случай 2026-08-27: у шага diff-cover разъехался
  # PYTHONPATH, сборка тестов падала, деплой стоял на ЧЕТЫРЁХ коммитах, и
  # узналось это только когда кто-то заметил, что сервер отстал.
  # Секреты: TELEGRAM_BOT_TOKEN_VERA и OWNER_TELEGRAM_ID (без них молча выходит).
  notify:
    needs: [docs, quality, test, build, deploy]
    # cancelled обязателен наравне с failure: при упоре в timeout-minutes
    # GitHub помечает job как cancelled, и условие только на failure пропускало
    # бы ровно тот случай, от которого этот job и написан — «деплой встал, и
    # никто не узнал». Нашло ревью.
    # Только вне PR: провал на PR виден в самом PR, а DM владельцу на каждый
    # красный чек чужой ветки — шум, от которого перестают читать уведомления.
    # Ровно так 27.08 и потеряли мёртвый bot-telegram среди ложных тревог.
    if: >-
      always() && github.event_name != 'pull_request'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    steps:
      - name: Написать владельцу, что и где упало
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_VERA }}
          OWNER_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_DOCS: ${{ needs.docs.result }}
          R_QUALITY: ${{ needs.quality.result }}
          R_TEST: ${{ needs.test.result }}
          R_BUILD: ${{ needs.build.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
        run: |
          [ -z "$BOT_TOKEN" ] && exit 0
          [ -z "$OWNER_ID" ] && exit 0
          FAILED=""
          for pair in "docs:$R_DOCS" "quality:$R_QUALITY" "test:$R_TEST" "build:$R_BUILD" "deploy:$R_DEPLOY"; do
            case "${pair#*:}" in
              failure) FAILED="$FAILED ${pair%%:*}";;
              cancelled) FAILED="$FAILED ${pair%%:*}(cancelled)";;
            esac
          done
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
               -d "chat_id=${OWNER_ID}" \
               -d "text=vera3: деплой НЕ прошёл. Упало:${FAILED}%0A${RUN_URL}" \
               -o /dev/null || true
